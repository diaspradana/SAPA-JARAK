services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sapa_jarak_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-SAPA-JARAK}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_TIMEZONE: "Asia/Jakarta"
      APP_LOCALE: "id"
      APP_FALLBACK_LOCALE: "en"
      
      # Database Configuration
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-sapa_jarak}"
      DB_USERNAME: "${DB_USERNAME:-sapa_user}"
      DB_PASSWORD: "${DB_PASSWORD:-sapa_secret}"
      
      # Startup Migrations & Seeding
      AUTORUN_MIGRATIONS: "${AUTORUN_MIGRATIONS:-true}"
      AUTORUN_SEED: "${AUTORUN_SEED:-true}"
      OPTIMIZE_LARAVEL: "${OPTIMIZE_LARAVEL:-false}"
      
      # Session, Cache, & Logs
      LOG_CHANNEL: "stack"
      LOG_STACK: "single"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SESSION_DRIVER: "file"
      CACHE_STORE: "file"
      QUEUE_CONNECTION: "sync"
      
      # WhatsApp Gateway Simulation
      WHATSAPP_SIMULATION_MODE: "true"

      # AI Assistant / ML Decision Support Service
      ML_SERVICE_URL: "${ML_SERVICE_URL:-http://ai_assistant:8001}"
    volumes:
      - sapa_storage:/var/www/html/storage
      - sapa_sqlite:/var/www/html/database/sqlite
    depends_on:
      db:
        condition: service_healthy
        required: false
      ai_assistant:
        condition: service_healthy
        required: false
    networks:
      - sapa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  ai_assistant:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: sapa_jarak_ai
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8001}:8001"
    environment:
      PORT: 8001
      HOST: 0.0.0.0
    networks:
      - sapa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: mysql:8.0
    container_name: sapa_jarak_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sapa_jarak}"
      MYSQL_USER: "${DB_USERNAME:-sapa_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-sapa_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - sapa_db_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    networks:
      - sapa_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sapa_jarak_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - sapa_network
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

networks:
  sapa_network:
    driver: bridge

volumes:
  sapa_db_data:
    driver: local
  sapa_storage:
    driver: local
  sapa_sqlite:
    driver: local
